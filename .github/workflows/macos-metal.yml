name: macOS Metal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-clang:
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install ninja sdl2
      - name: Configure
        run: cmake --preset macos-metal-${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset build-macos-metal-${{ matrix.preset }}
      - name: CPU and build conformance
        run: ctest --preset test-macos-metal-${{ matrix.preset }} --exclude-regex "^metal_"

  # Standard hosted macOS runners do not guarantee GPU passthrough. This job is
  # the M17 acceptance gate and intentionally targets a Metal-capable runner.
  metal-hardware:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, metal]
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install ninja sdl2
      - name: Configure
        run: cmake --preset macos-metal-debug
      - name: Build
        run: cmake --build --preset build-macos-metal-debug
      - name: Native Metal acceptance
        env:
          MTL_DEBUG_LAYER: "1"
          MTL_SHADER_VALIDATION: "1"
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: "1"
          MTL_SHADER_VALIDATION_ABORT_ON_FAULT: "1"
        run: ctest --preset test-macos-metal-debug --label-regex metal-hardware
      - name: Upload Metal visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m17-metal-captures
          path: build/macos-metal-debug/m17-metal-captures/*.bmp
          if-no-files-found: error
